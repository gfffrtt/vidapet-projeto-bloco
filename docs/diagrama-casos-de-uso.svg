<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="22" text-anchor="middle" font-size="15" font-weight="bold">Diagrama de Casos de Uso – Sistema VidaPet (Gustavo Trapp – PB – TP1)</text>

  <!-- fronteira do sistema -->
  <rect x="150" y="38" width="610" height="505" fill="#f7f9fc" stroke="#333" stroke-width="1.5"/>
  <text x="455" y="58" text-anchor="middle" font-weight="bold">Sistema VidaPet</text>

  <!-- ator Recepcionista -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="70" cy="150" r="13"/>
    <line x1="70" y1="163" x2="70" y2="205"/>
    <line x1="45" y1="178" x2="95" y2="178"/>
    <line x1="70" y1="205" x2="50" y2="238"/>
    <line x1="70" y1="205" x2="90" y2="238"/>
  </g>
  <text x="70" y="258" text-anchor="middle" font-weight="bold">Recepcionista</text>

  <!-- ator Veterinário -->
  <g stroke="#333" stroke-width="2" fill="none">
    <circle cx="835" cy="380" r="13"/>
    <line x1="835" y1="393" x2="835" y2="435"/>
    <line x1="810" y1="408" x2="860" y2="408"/>
    <line x1="835" y1="435" x2="815" y2="468"/>
    <line x1="835" y1="435" x2="855" y2="468"/>
  </g>
  <text x="835" y="488" text-anchor="middle" font-weight="bold">Veterinário</text>

  <!-- associações Recepcionista -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="98" y1="185" x2="196" y2="95"/>
    <line x1="98" y1="190" x2="196" y2="165"/>
    <line x1="98" y1="195" x2="196" y2="235"/>
    <line x1="98" y1="200" x2="200" y2="312"/>
  </g>
  <!-- associações Veterinário -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="808" y1="415" x2="530" y2="430"/>
    <line x1="808" y1="425" x2="722" y2="495"/>
  </g>

  <!-- casos de uso -->
  <g fill="#fff8e1" stroke="#333" stroke-width="1.5">
    <ellipse cx="310" cy="95"  rx="115" ry="26"/>
    <ellipse cx="310" cy="165" rx="115" ry="26"/>
    <ellipse cx="310" cy="235" rx="115" ry="26"/>
    <ellipse cx="310" cy="312" rx="115" ry="26"/>
    <ellipse cx="410" cy="430" rx="120" ry="28"/>
    <ellipse cx="605" cy="500" rx="118" ry="26"/>
  </g>
  <g fill="#e8f1fb" stroke="#333" stroke-width="1.5" stroke-dasharray="0">
    <ellipse cx="610" cy="185" rx="125" ry="28"/>
    <ellipse cx="610" cy="335" rx="125" ry="28"/>
  </g>
  <g text-anchor="middle">
    <text x="310" y="100">UC01 Cadastrar animal</text>
    <text x="310" y="170">UC02 Cadastrar veterinário</text>
    <text x="310" y="240">UC03 Agendar consulta</text>
    <text x="310" y="317">UC04 Cancelar consulta</text>
    <text x="410" y="427">UC06 Registrar consulta</text>
    <text x="410" y="443">realizada</text>
    <text x="605" y="505">UC05 Consultar agenda do dia</text>
    <text x="610" y="181">Validar horário</text>
    <text x="610" y="197">de atendimento</text>
    <text x="610" y="331">Verificar situação</text>
    <text x="610" y="347">"agendada"</text>
  </g>

  <!-- includes -->
  <g stroke="#333" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#open)">
    <line x1="424" y1="228" x2="487" y2="198"/>
    <line x1="424" y1="316" x2="485" y2="330"/>
    <line x1="470" y1="405" x2="560" y2="361"/>
  </g>
  <g font-size="12" font-style="italic" fill="#333" text-anchor="middle">
    <text x="455" y="202">«include»</text>
    <text x="455" y="308">«include»</text>
    <text x="540" y="400">«include»</text>
  </g>
</svg>
